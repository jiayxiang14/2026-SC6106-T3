let web3;
let contract;

async function connect(){
    web3 = new Web3(Web3.givenProvider);
    const accounts = await web3.eth.requestAccounts();
    contract = new web3.eth.Contract(contractABI, contractAddress);

    document.getElementById("output").innerText = "Wallet Connected: " + accounts[0];
}

async function getLogs(){
    const result = await contract.methods.getLogs().call();

    let text = "";

    for(let i=0;i<result.length;i++){
        text += "User: " + result[i].user + "\n";
        text += "Action: " + result[i].action + "\n";
        text += "Amount: " + result[i].amount + "\n";
        text += "----------------------\n";
    }

    document.getElementById("output").innerText = text || "No logs found";
}
